name: SunoPlayer
options:
  bundleIdPrefix: com.toma
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.3"
    CURRENT_PROJECT_VERSION: "9"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
targets:
  SunoPlayer:
    type: application
    platform: iOS
    sources:
      - path: SunoPlayer
      - path: Shared
    dependencies:
      - target: SunoPlayerWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thomas.sunoplayer
        DEVELOPMENT_TEAM: VYGBHQ4ZDQ
        INFOPLIST_FILE: SunoPlayer/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: SunoPlayerWatch
        embed: true
    scheme:
      testTargets:
        - SunoPlayerTests
      gatherCoverageData: true
  SunoPlayerWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: SunoPlayerWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thomas.sunoplayer.watchkitapp
        DEVELOPMENT_TEAM: VYGBHQ4ZDQ
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: SunoPlayerWatch/Info.plist
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  SunoPlayerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SunoPlayerTests
    dependencies:
      - target: SunoPlayer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thomas.sunoplayer.tests
        GENERATE_INFOPLIST_FILE: YES
  SunoPlayerWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: SunoPlayerWatch
      - path: Shared
    info:
      path: SunoPlayerWatch/Info.plist
      properties:
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.thomas.sunoplayer
        WKRunsIndependentlyOfCompanionApp: false
        UIBackgroundModes:
          - audio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thomas.sunoplayer.watchkitapp
        DEVELOPMENT_TEAM: VYGBHQ4ZDQ
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.thomas.sunoplayer
        INFOPLIST_KEY_WKWatchOnly: NO
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: NO
        INFOPLIST_KEY_CFBundleDisplayName: SunoPlayer
        TARGETED_DEVICE_FAMILY: "4"
    scheme: {}
